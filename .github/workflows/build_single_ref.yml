name: Build single ref
run-name: Build ${{ inputs.package || 'hello-conan' }}/${{ inputs.version ||   '0.0.1.cci.20241029' }}

on:
  push:
    paths-ignore:
      - 'recipes/**'
  pull_request:
    paths-ignore:
      - 'recipes/**'
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      version:
        type: string
        required: true
      upload:
        type: boolean
        required: false
        default: false
    secrets:
      ARTIFACTORY_USER:
        description: 'User to authenticate with Artifactory'
        required: true
      ARTIFACTORY_TOKEN:
        description: 'API Key to authenticate with Artifactory'
        required: true

  workflow_dispatch:
    inputs:
      package:
        type: string
        required: true
      version:
        type: string
        required: true
      upload:
        type: boolean
        required: false
        default: false

env:
  PACKAGE: ${{ inputs.package || 'hello-conan' }}
  VERSION: ${{ inputs.version || '0.0.1.cci.20241029' }}
  REF: ${{ inputs.package || 'hello-conan' }}/${{ inputs.version || '0.0.1.cci.20241029' }}
  UPLOAD_BINARY: ${{ inputs.upload }}

jobs:  
  prepare-matrix:
    runs-on: ubuntu-slim
    outputs:
      folder: ${{ steps.get_folder.outputs.result }}
      matrix: ${{ steps.search_shared_option.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            pyproject.toml
            uv.lock
            packages_to_upload.yml
            recipes/${{ env.PACKAGE }}

      - id: get_folder
        run: |
          folder=$(yq ".versions.\"${VERSION}\".folder" "recipes/${PACKAGE}/config.yml")
          echo "result=$folder"
          echo "result=$folder" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-conan

      - uses: ./.github/actions/setup-remote
        with:
          artifactory-user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory-token: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory-server:  ${{ vars.ARTIFACTORY_URL }}
        if: ${{ github.ref == 'refs/heads/community_index' }}

      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
      - run: npm ci
      - uses: actions/github-script@v9
        id: search_shared_option
        with:
          script: |
            const {
              exitCode,
              stdout,
              stderr
            } = await exec.getExecOutput('conan', ['inspect', `recipes/${process.env.PACKAGE}/${{ steps.get_folder.outputs.result }}`, '--format=json']);
            if( exitCode != 0 ) {
              core.setFailed(`Could not parse recipe. error ${exitCode}: ${stderr}`);
              return
            }
            const info = JSON.parse(stdout)
            core.info(JSON.stringify(info))

            const homepage = (info.homepage ?? "")
            const upload_sources = homepage.includes("gnu.org/") || homepage.includes("freedesktop.org/")

            const fs = require('node:fs/promises');
            const { load } = require('js-yaml');
            const fileContent = await fs.readFile(`packages_to_upload.yml`, 'utf8');
            const packages_to_upload = load(fileContent)
            const upload_binary = process.env.UPLOAD_BINARY == 'true' || packages_to_upload.includes(process.env.PACKAGE)
            return {
              os: ['ubuntu-26.04', 'windows-2025-vs2026', 'macos-26', 'ubuntu-26.04-arm', 'windows-11-arm', 'macos-26-arm64'],
              shared: ( "shared" in info.options_definitions ) ? ['-o*/*:shared=False', '-o*/*:shared=True'] : (info.package_type == 'shared-library') ? ['-o*/*:shared=True'] : [''],
              build_type: ["Release"],
              upload_sources: [upload_sources ? "true" : "false"],
              upload_binary: [upload_binary ? "true": "false"]
            };

      - if: github.ref == 'refs/heads/community_index'
        run: |
          conan export --version=$VERSION --no-remote recipes/$PACKAGE/${{ steps.get_folder.outputs.result }}
          conan upload -r community $REF --confirm --only-recipe
      - name: Collect logs
        if: failure()
        run: cat process.log || echo "No log file found"
        shell: bash
      - run: gh api rate_limit || echo "could not get gh rate limits"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [prepare-matrix]
    env:
      FOLDER: recipes/${{ inputs.package || 'hello-conan' }}/${{ needs.prepare-matrix.outputs.folder }}
      CLI_ARGS: -sbuild_type=${{ matrix.build_type }} ${{ matrix.shared }}
      REQ: ${{ inputs.package == 'msys2' && '-s:b arch=x86_64 --tool-require' || '--require' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            pyproject.toml
            uv.lock
            ${{ env.FOLDER }}

      - uses: ./.github/actions/setup-conan
          
      - uses: ./.github/actions/setup-remote
        with:
          artifactory-user: ${{ secrets.ARTIFACTORY_USER }}
          artifactory-token: ${{ secrets.ARTIFACTORY_TOKEN }}
          artifactory-server:  ${{ vars.ARTIFACTORY_URL }}

      - run: conan export --version=${{ env.VERSION }} --no-remote ${{ env.FOLDER }}

      - run: |
          CONAN_PATH=$(conan config home)
          PROFILE_PATH=$(conan profile path autodetected)
          COMPILER=$(awk -F "=" '/^compiler=/ {print $2}' $PROFILE_PATH)
          CPP_STDS=$(uv run python -c "import yaml;import sys;print(*yaml.safe_load(sys.stdin)['compiler']['$COMPILER']['cppstd'])" < $CONAN_PATH/settings.yml)
          for cpp_std in $CPP_STDS; do
            if [ "$cpp_std" = "None" ]; then
              ARG=""
            else
              ARG="-s compiler.cppstd=$cpp_std"
            fi
            if ! conan profile show $ARG ${{ env.CLI_ARGS }}
            then
              continue
            fi
            conan graph info $ARG ${{ env.REQ }}=${{ env.REF }} --build=missing --build=${{ env.REF }} ${{ env.CLI_ARGS }} --format=json > graph.json
            if jq -e 'any(.graph.nodes[]; .binary == "Invalid")' graph.json
            then
              continue
            else
              if [ "$cpp_std" != "None" ]
              then
                echo "compiler.cppstd=$cpp_std" >> $PROFILE_PATH
              fi
              echo "CODE=0" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "CODE=6" >> "$GITHUB_OUTPUT"
        id: conan_install
        name: Conan Graph
        shell: bash

      - name: Conan graph outdated
        run: conan graph info ${{ env.REQ }}=${{ env.REF }} --build=missing --build=${{ env.REF }} ${{ env.CLI_ARGS }} --format=html > graph-${{ env.PACKAGE }}-${{ env.VERSION }}-${{ matrix.os }}.html

      - uses: actions/upload-artifact@v7
        with:
          path: graph-${{ env.PACKAGE }}-${{ env.VERSION }}-${{ matrix.os }}.html
          overwrite: true
          archive: false

      - name: Generate conan graph
        run: conan graph outdated ${{ env.REQ }}=${{ env.REF }} --build=missing --build=${{ env.REF }} ${{ env.CLI_ARGS }}

      - if: ${{ steps.conan_install.outputs.CODE != 6 }}
        name: Remove system OpenSSL directory
        shell: bash
        run: |
          paths=(
            "/c/Program Files/OpenSSL"
            "/c/Program Files/OpenSSL-Win64"
            "/c/Program Files (x86)/OpenSSL"
            "/c/Strawberry"
            "/c/Program Files/MySQL"
            "/c/Program Files/Amazon"
            "/c/tools/php"
            "/c/mingw64"
          )
          rm -f /c/Windows/System32/libssl-*.dll
          rm -f /c/Windows/System32/libcrypto-*.dll
          
          for path in "${paths[@]}"; do
            rm -rf "$path" &
          done
          wait

      - run: conan install ${{ env.REQ }}=${{ env.REF }} --build=missing --build=${{ env.REF }} ${{ env.CLI_ARGS }} --format=json > create.json
        name: Conan Install
        if: ${{ steps.conan_install.outputs.CODE != 6 }}

      - run: conan cache backup-upload
        if: ${{ !cancelled() && matrix.upload_sources == 'true' }}

      - run: conan test ${{ env.FOLDER }}/test_package/conanfile.py ${{ env.REF }} --build=missing ${{ env.CLI_ARGS }}
        if: ${{ steps.conan_install.outputs.CODE != 6 }}

      - name: Conan upload
        if: ${{ steps.conan_install.outputs.CODE != 6 && matrix.upload_binary == 'true' }}
        run: |
          echo "core.sources:exclude_urls=[\"\"]" >> "$(conan config home)/global.conf"
          conan list --graph=create.json --graph-binaries=build --format=json > pkglist.json
          conan upload -r community --list=pkglist.json --confirm
        shell: bash

      - name: Collect logs
        if: failure()
        run: cat process.log || echo "No log file found"
        shell: bash
      - run: gh api rate_limit || echo "could not get gh rate limits"
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
